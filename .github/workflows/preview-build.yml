name: Preview build
run-name: "Preview build - ${{ github.sha }}"

on:
  push:
    branches:
      - "master"
    tags-ignore:
      - "**"
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "setup.py"
      - "MANIFEST.in"
      - "build_backend/**"
      - "src/**"
  workflow_dispatch: {}

jobs:
  trigger:
    name: "Preview build - ${{ github.sha }}"
    runs-on: ubuntu-slim
    steps:
      - name: Windows builds
        env:
          TOKEN: ${{ secrets.STREAMLINKBOT_PREVIEW_BUILD || secrets.PREVIEW_BUILD_TOKEN }}
          WORKFLOW_REPO: ${{ vars.WINDOWS_BUILDS_REPO || 'streamlink/windows-builds' }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "No preview build token provided, skipping Windows builds."
            exit 0
          fi
          workflow="${WORKFLOW_REPO}/actions/workflows/preview-build.yml"
          html_url=$(curl -sfL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${TOKEN}" \
            -d '{"return_run_details":true,"ref":"master","inputs":{"ref":"${{ github.sha }}"}}' \
            "https://api.github.com/repos/${workflow}/dispatches" \
            | jq -r '.html_url' \
          )
          echo -e "## Windows builds\n\n- ${html_url}\n- https://github.com/${workflow}\n" \
            >> "${GITHUB_STEP_SUMMARY}"
      - name: Linux AppImage
        env:
          TOKEN: ${{ secrets.STREAMLINKBOT_PREVIEW_BUILD || secrets.PREVIEW_BUILD_TOKEN }}
          WORKFLOW_REPO: ${{ vars.APPIMAGE_BUILDS_REPO || 'streamlink/streamlink-appimage' }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "No preview build token provided, skipping Linux AppImage build."
            exit 0
          fi
          workflow="${WORKFLOW_REPO}/actions/workflows/preview-build.yml"
          html_url=$(curl -sfL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${TOKEN}" \
            -d '{"return_run_details":true,"ref":"master","inputs":{"ref":"${{ github.sha }}"}}' \
            "https://api.github.com/repos/${workflow}/dispatches" \
            | jq -r '.html_url' \
          )
          echo -e "## AppImage\n\n- ${html_url}\n- https://github.com/${workflow}\n" \
            >> "${GITHUB_STEP_SUMMARY}"
